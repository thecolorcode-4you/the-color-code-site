<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>KPI Dashboard — The Color Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF8F4; --surface: #ECE7E1; --text: #2B2522; --text-muted: #726862;
    --accent: #B5675F; --accent-deep: #8F4B44; --accent-tint: #F1E0DC;
    --border: rgba(43, 37, 34, 0.16); --on-accent: #FBF3F1;
    --ok: #3C7A4B; --ok-bg: #E4F0E6; --behind: #A6862F; --behind-bg: #FBF3DE; --unknown-bg: #ECE7E1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; margin: 0; }
  p { margin: 0; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 60px; }
  header.top { margin-bottom: 24px; }
  .eyebrow { font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 600; }
  h1 { font-size: 30px; margin-top: 4px; }
  .last-updated { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  .update-note { margin-top: 14px; padding: 14px 16px; background: var(--surface); border-radius: 10px; font-size: 14.5px; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 16px; margin-bottom: 16px; }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .card h2 { font-size: 19px; }
  .stage-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 600; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 100px; white-space: nowrap; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.behind { color: var(--behind); background: var(--behind-bg); }
  .badge.unknown { color: var(--text-muted); background: var(--unknown-bg); }
  .value-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .value { font-family: 'Instrument Serif', serif; font-size: 36px; line-height: 1; }
  .value.muted { color: var(--text-muted); font-size: 20px; font-family: 'Manrope', sans-serif; }
  .target-line { font-size: 13px; color: var(--text-muted); text-align: right; }
  .change-line { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  svg.spark { display: block; margin-top: 10px; width: 100%; height: 44px; }
  .decision { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13.5px; }
  .decision strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
  .source-line { margin-top: 10px; font-size: 12px; color: var(--text-muted); }
  .status-note { margin-top: 8px; font-size: 12.5px; color: var(--behind); background: var(--behind-bg); padding: 8px 10px; border-radius: 8px; }
  section.funnel { margin-top: 32px; }
  section.funnel h2 { font-size: 21px; margin-bottom: 4px; }
  .funnel-source-line { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  table.funnel-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.funnel-table th, table.funnel-table td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  table.funnel-table th:first-child, table.funnel-table td:first-child { text-align: left; }
  table.funnel-table th { color: var(--text-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  footer.page-foot { margin-top: 36px; font-size: 12px; color: var(--text-muted); text-align: center; }
  @media (max-width: 420px) { .value { font-size: 30px; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="eyebrow">The Color Code — internal</p>
    <h1>KPI Dashboard</h1>
    <p class="last-updated" data-last-updated>Loading…</p>
    <div class="update-note" data-update-note></div>
  </header>

  <main data-kpi-cards></main>

  <section class="funnel">
    <h2>Funnel by source</h2>
    <p class="funnel-source-line" data-funnel-source></p>
    <table class="funnel-table">
      <thead>
        <tr><th>Source</th><th>Visitors</th><th>Sign-ups</th><th>Active this week</th><th>Active 4 wks after sign-up</th></tr>
      </thead>
      <tbody data-funnel-rows></tbody>
    </table>
  </section>

  <footer class="page-foot">
    Internal dashboard — not indexed, not linked from the public site. Counts only, never names or emails.
  </footer>
</div>

<script>
var STAGE_LABEL = {
  awareness: 'Awareness', interest: 'Interest', purchase_intention: 'Purchase intention', retention: 'Retention'
};

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function fmtNum(n) {
  return typeof n === 'number' ? n.toLocaleString() : n;
}

function sparkline(history) {
  var pts = history.filter(function (h) { return typeof h.value === 'number'; });
  if (pts.length < 2) return '<p class="source-line">Not enough days of data yet for a chart.</p>';
  var vals = pts.map(function (p) { return p.value; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var w = 300, svgH = 40, pad = 3;
  var range = (max - min) || 1;
  var coords = pts.map(function (p, i) {
    var x = pad + (i / (pts.length - 1)) * (w - pad * 2);
    var y = pad + (1 - (p.value - min) / range) * (svgH - pad * 2);
    return x + ',' + y;
  });
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + svgH + '" preserveAspectRatio="none">' +
    '<polyline points="' + coords.join(' ') + '" fill="none" stroke="#B5675F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function onTrackBadge(kpi) {
  if (!kpi.defined) return '<span class="badge unknown">Not yet defined</span>';
  var last = kpi.history.filter(function (h) { return typeof h.value === 'number'; }).slice(-1)[0];
  if (!last) return '<span class="badge unknown">No data yet</span>';
  if (kpi.target == null || !kpi.target_date) return '<span class="badge unknown">No target set</span>';
  var today = new Date(), target = new Date(kpi.target_date + 'T00:00:00');
  var start = new Date('2026-10-22T00:00:00'); // when this KPI's target was set
  var totalDays = Math.max(1, (target - start) / 86400000);
  var elapsedDays = Math.max(0, (today - start) / 86400000);
  var expectedShare = Math.min(1, elapsedDays / totalDays);
  var actualShare = last.value / kpi.target;
  return actualShare + 0.03 >= expectedShare
    ? '<span class="badge ok">On track</span>'
    : '<span class="badge behind">Behind pace</span>';
}

function changeLine(kpi) {
  var pts = kpi.history.filter(function (h) { return typeof h.value === 'number'; });
  if (pts.length < 2) return pts.length === 1 ? 'First reading — no prior value to compare yet.' : '';
  var delta = pts[pts.length - 1].value - pts[pts.length - 2].value;
  var sign = delta > 0 ? '+' : '';
  return 'Change since last update: ' + sign + fmtNum(delta);
}

function renderCard(kpi) {
  var last = kpi.history.filter(function (h) { return typeof h.value === 'number'; }).slice(-1)[0];
  var valueHtml = last
    ? '<span class="value">' + fmtNum(last.value) + '</span>'
    : '<span class="value muted">' + (kpi.defined ? 'No data yet' : 'Not yet defined') + '</span>';
  var targetHtml = (kpi.defined && kpi.target != null && kpi.target_date)
    ? '<span class="target-line">Target: ' + fmtNum(kpi.target) + ' by ' + kpi.target_date + '</span>'
    : '<span class="target-line">' + (kpi.defined ? 'Target not yet set' : '') + '</span>';
  return '' +
    '<article class="card" id="kpi-' + kpi.id + '">' +
      '<div class="card-top"><div><p class="stage-tag">' + (STAGE_LABEL[kpi.stage] || kpi.stage) + '</p>' +
      '<h2>' + esc(kpi.name) + '</h2></div>' + onTrackBadge(kpi) + '</div>' +
      '<div class="value-row">' + valueHtml + targetHtml + '</div>' +
      '<p class="change-line">' + changeLine(kpi) + '</p>' +
      (kpi.history && kpi.history.length ? sparkline(kpi.history) : '') +
      (kpi.decision ? '<div class="decision"><strong>Decision this drives</strong>' + esc(kpi.decision) + '</div>' : '') +
      (kpi.source ? '<p class="source-line"><strong>Source:</strong> ' + esc(kpi.source) + '</p>' : '') +
      (kpi.status_note ? '<p class="status-note">' + esc(kpi.status_note) + '</p>' : '') +
    '</article>';
}

fetch('kpi-data.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (data) {
  document.querySelector('[data-last-updated]').textContent = 'Last updated: ' + data.last_updated;
  document.querySelector('[data-update-note]').textContent = data.update_note;
  document.querySelector('[data-kpi-cards]').innerHTML = data.kpis.map(renderCard).join('');

  document.querySelector('[data-funnel-source]').textContent = 'Source: ' + data.funnel_by_source.source;
  document.querySelector('[data-funnel-rows]').innerHTML = data.funnel_by_source.rows.map(function (r) {
    return '<tr><td>' + esc(r.source) + '</td><td>' + fmtNum(r.visitors) + '</td><td>' + fmtNum(r.sign_ups) + '</td><td>' + fmtNum(r.active_this_week) + '</td><td>' + fmtNum(r.active_4wk_later) + '</td></tr>';
  }).join('');
}).catch(function (e) {
  document.querySelector('[data-kpi-cards]').innerHTML = '<p>Could not load kpi-data.json: ' + esc(e.message) + '</p>';
});
</script>
</body>
</html>
